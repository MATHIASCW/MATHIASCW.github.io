  <text x="580" y="506" fill="#202623" font-family="monospace" font-size="15" text-anchor="middle">kg-ont:Location</text>
  <rect x="76" y="630" width="1048" height="82" rx="6" fill="#25382e" stroke="#a7c8b5"/>
