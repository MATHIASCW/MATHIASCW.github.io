  <text x="76" y="132" fill="#68706a" font-family="monospace" font-size="13">TOLKIEN GATEWAY · RDF · SPARQL · SHACL</text>
  <path d="M320 282 L590 220 M320 282 L580 500 M840 282 L590 220 M840 282 L580 500" stroke="#e85d4a" stroke-width="3"/>
  <circle cx="320" cy="282" r="92" fill="#25382e" stroke="#a7c8b5" stroke-width="3"/>
  <circle cx="840" cy="282" r="92" fill="#25382e" stroke="#a7c8b5" stroke-width="3"/>
  <circle cx="590" cy="220" r="78" fill="#e85d4a"/>
  <circle cx="580" cy="500" r="78" fill="#fcfcfc" stroke="#e85d4a" stroke-width="3"/>
