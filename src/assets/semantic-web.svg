  <text x="320" y="306" fill="#f7f4ee" font-family="monospace" font-size="14" text-anchor="middle">kg-res:Aragorn</text>
  <text x="840" y="276" fill="#a7c8b5" font-family="sans-serif" font-size="22" text-anchor="middle">Object</text>
  <text x="840" y="306" fill="#f7f4ee" font-family="monospace" font-size="14" text-anchor="middle">kg-res:Rivendell</text>
