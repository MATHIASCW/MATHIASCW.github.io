<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Voice Virtual Assistant pipeline</title>
  <desc id="desc">Simplified flow from microphone input through Python and ElevenLabs Conversational AI to spoken audio output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e85d4a"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#f7f4ee"/>
  <rect x="34" y="28" width="1132" height="744" rx="12" fill="#202623"/>

  <g transform="translate(895 70)">
    <rect x="0" y="-24" width="42" height="42" rx="8" fill="#f7f4ee"/>
    <path d="M12 -10v14 M21 -17v28 M30 -10v14" fill="none" stroke="#202623" stroke-width="5" stroke-linecap="round"/>
    <text x="58" y="6" fill="#f7f4ee" font-family="sans-serif" font-size="21" font-weight="700" letter-spacing="1">ELEVENLABS</text>
  </g>

  <text x="76" y="88" fill="#a7c8b5" font-family="monospace" font-size="22" letter-spacing="3">VOICE VIRTUAL ASSISTANT</text>
  <text x="76" y="128" fill="#68706a" font-family="monospace" font-size="15">REAL-TIME VOICE CONVERSATION</text>

  <g font-family="sans-serif" text-anchor="middle">
    <rect x="86" y="270" width="190" height="138" rx="8" fill="#25382e" stroke="#a7c8b5" stroke-width="2"/>
    <text x="181" y="326" fill="#f7f4ee" font-size="23">Microphone</text>
    <text x="181" y="358" fill="#a7c8b5" font-family="monospace" font-size="15">VOICE INPUT</text>

    <rect x="350" y="270" width="190" height="138" rx="8" fill="#25382e" stroke="#a7c8b5" stroke-width="2"/>
    <text x="445" y="326" fill="#f7f4ee" font-size="25">Python</text>
    <text x="445" y="360" fill="#a7c8b5" font-size="18">Jupyter Notebook</text>

    <rect x="614" y="228" width="250" height="222" rx="8" fill="#e85d4a"/>
    <text x="739" y="316" fill="#202623" font-size="23" font-weight="700">ElevenLabs</text>
    <text x="739" y="350" fill="#202623" font-size="18">Conversational AI</text>
    <text x="739" y="390" fill="#202623" font-family="monospace" font-size="15">LIVE VOICE RESPONSE</text>

    <rect x="938" y="270" width="176" height="138" rx="8" fill="#25382e" stroke="#a7c8b5" stroke-width="2"/>
    <text x="1026" y="326" fill="#f7f4ee" font-size="23">Speakers</text>
    <text x="1026" y="358" fill="#a7c8b5" font-family="monospace" font-size="15">AUDIO OUTPUT</text>
  </g>

  <path d="M276 339h64 M540 339h62 M864 339h64" fill="none" stroke="#e85d4a" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="230" y="520" width="740" height="96" rx="8" fill="#25382e" stroke="#a7c8b5" stroke-width="2"/>
  <text x="260" y="556" fill="#a7c8b5" font-family="monospace" font-size="15">DYNAMIC CONTEXT</text>
  <text x="260" y="590" fill="#f7f4ee" font-family="sans-serif" font-size="21">User name · daily schedule</text>
  <path d="M739 450v68" fill="none" stroke="#e85d4a" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrow)"/>

  <rect x="76" y="675" width="1048" height="52" rx="6" fill="#f7f4ee"/>
  <text x="104" y="708" fill="#202623" font-family="monospace" font-size="17">conversation.start_session()  ·  microphone → ElevenLabs → speakers</text>
</svg>
